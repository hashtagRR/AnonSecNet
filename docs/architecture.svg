<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="470" rx="14" fill="#ffffff"/>

  <!-- Receiver side -->
  <text x="215" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4c7e">Path A: requests</text>
  <text x="215" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4c7e">Path B: responses</text>

  <rect x="20" y="160" width="100" height="80" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="70" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Receiver</text>
  <text x="70" y="216" text-anchor="middle" font-size="13" fill="#444">client</text>

  <g fill="#e6eef9" stroke="#2b4c7e" stroke-width="2">
    <circle cx="150" cy="90" r="22"/><circle cx="215" cy="90" r="22"/><circle cx="280" cy="90" r="22"/>
    <circle cx="150" cy="330" r="22"/><circle cx="215" cy="330" r="22"/><circle cx="280" cy="330" r="22"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b4c7e" font-weight="bold">
    <text x="150" y="94">MN1</text><text x="215" y="94">MN2</text><text x="280" y="94">MN3</text>
    <text x="150" y="334">MNa</text><text x="215" y="334">MNb</text><text x="280" y="334">MNc</text>
  </g>

  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M95,160 L135,108"/>
    <path d="M172,90 L191,90"/><path d="M237,90 L256,90"/>
    <path d="M298,104 L345,160"/>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-dasharray="6 4">
    <path d="M345,240 L298,316"/>
    <path d="M258,330 L239,330"/><path d="M193,330 L174,330"/>
    <path d="M135,312 L95,240"/>
  </g>

  <rect x="320" y="160" width="150" height="80" rx="10" fill="#fdf1dc" stroke="#a86f12" stroke-width="2"/>
  <text x="395" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Service Gateway</text>
  <text x="395" y="216" text-anchor="middle" font-size="13" fill="#444">receiver side</text>

  <!-- Cache Server -->
  <rect x="515" y="160" width="130" height="80" rx="10" fill="#e5f3ea" stroke="#2e7a4b" stroke-width="2"/>
  <text x="580" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Cache Server</text>
  <text x="580" y="216" text-anchor="middle" font-size="13" fill="#444">opaque store</text>
  <g stroke="#4a5568" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)">
    <path d="M475,200 L510,200"/>
    <path d="M650,200 L685,200"/>
  </g>

  <!-- Network Gateway (design only) -->
  <g stroke="#7a7f88" stroke-width="2" fill="none" stroke-dasharray="3 4" marker-end="url(#ah)" marker-start="url(#ah)">
    <path d="M440,244 L500,298"/>
    <path d="M720,244 L660,298"/>
    <path d="M580,354 L580,396"/>
  </g>
  <rect x="500" y="290" width="160" height="60" rx="10" fill="#f6f6f7" stroke="#7a7f88" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="580" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Network Gateway</text>
  <text x="580" y="335" text-anchor="middle" font-size="12" fill="#666">design only, not built</text>
  <rect x="525" y="400" width="110" height="40" rx="20" fill="#ffffff" stroke="#7a7f88" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="580" y="425" text-anchor="middle" font-size="14" fill="#333">Internet</text>

  <!-- Sender side -->
  <text x="945" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4c7e">Sender path A</text>
  <text x="945" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4c7e">Sender path B</text>

  <rect x="690" y="160" width="150" height="80" rx="10" fill="#fdf1dc" stroke="#a86f12" stroke-width="2"/>
  <text x="765" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Service Gateway</text>
  <text x="765" y="216" text-anchor="middle" font-size="13" fill="#444">sender side</text>

  <g fill="#e6eef9" stroke="#2b4c7e" stroke-width="2">
    <circle cx="880" cy="90" r="22"/><circle cx="945" cy="90" r="22"/><circle cx="1010" cy="90" r="22"/>
    <circle cx="880" cy="330" r="22"/><circle cx="945" cy="330" r="22"/><circle cx="1010" cy="330" r="22"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b4c7e" font-weight="bold">
    <text x="1010" y="94">MNi</text><text x="945" y="94">MNii</text><text x="880" y="94">MNiii</text>
    <text x="880" y="334">MNx</text><text x="945" y="334">MNy</text><text x="1010" y="334">MNz</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M1065,160 L1025,108"/>
    <path d="M988,90 L969,90"/><path d="M923,90 L904,90"/>
    <path d="M862,104 L815,160"/>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-dasharray="6 4">
    <path d="M815,240 L862,316"/>
    <path d="M902,330 L921,330"/><path d="M967,330 L986,330"/>
    <path d="M1025,312 L1065,240"/>
  </g>

  <rect x="1040" y="160" width="100" height="80" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="1090" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Sender</text>
  <text x="1090" y="216" text-anchor="middle" font-size="13" fill="#444">hidden service</text>
</svg>
